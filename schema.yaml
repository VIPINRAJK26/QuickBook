  /api/dashboard/events/:
    get:
      operationId: dashboard_events_list
      description: |-
        Staff-only event list with search and location filtering.

        Supports:
            ?search=<term>    — searches title, description, location
            ?location=<term>  — filters by location specifically

        Uses the existing EventFilter from the events app.
        Paginated via global StandardResultsSetPagination.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/dashboard/events/{id}/update/:
    patch:
      operationId: dashboard_events_update_partial_update
      description: |-
        Staff-only event update (PATCH).
        Delegates to EventService.update_event() from the events app.
