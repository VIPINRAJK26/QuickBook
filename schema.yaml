  /api/bookings/:
    get:
      operationId: bookings_list
      description: |-
        GET  /api/bookings/     → List the authenticated user's bookings.
        POST /api/bookings/     → Create a new booking.

        Combines list and create on the same path because Django URL
        routing does not dispatch by HTTP method. The list behaviour
        is provided by ListAPIView; the POST handler is added manually
        to keep the view thin, following the project's existing pattern.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: |-
        GET  /api/bookings/     → List the authenticated user's bookings.
        POST /api/bookings/     → Create a new booking.

        Combines list and create on the same path because Django URL
        routing does not dispatch by HTTP method. The list behaviour
        is provided by ListAPIView; the POST handler is added manually
        to keep the view thin, following the project's existing pattern.
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/bookings/{id}/cancel/:
    post:
      operationId: bookings_cancel_create
      description: |-
        POST /api/bookings/<id>/cancel/

        Cancels a confirmed booking and restores the seats to the event.

        Uses POST rather than PATCH because this is a discrete action/command,
        not a general-purpose partial update. This prevents clients from
        setting arbitrary fields and matches the project's existing
        action-style endpoints (e.g. POST /api/auth/login/).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
