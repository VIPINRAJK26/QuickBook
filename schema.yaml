components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_id:
          type: integer
          readOnly: true
        event_title:
          type: string
          readOnly: true
        seats:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_id
      - event_title
      - id
      - seats
      - status
      - updated_at
    BookingCreateRequest:
      type: object
      properties:
        event_id:
          type: integer
        seats:
          type: integer
          minimum: 1
      required:
      - event_id
      - seats
    DashboardUserDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        referral_code:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - email
      - id
      - referral_code
      - username
    DashboardUserList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        referral_code:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
      required:
      - email
      - id
      - referral_code
      - username
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        location:
          type: string
          maxLength: 255
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        total_seats:
          type: integer
